<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireNexus | Global Wildfire Intelligence</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="ri-fire-fill"></i>
            <span>FireNexus</span>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-link active">
                <i class="ri-map-2-line"></i>
                Live Map
            </a>
            <a href="prediction.html" class="nav-link">
                <i class="ri-brain-line"></i>
                AI Predictions
            </a>
        </div>
    </nav>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <div style="font-weight: 500; letter-spacing: 1px;">INITIALIZING FIRENEXUS...</div>
    </div>

    <!-- Map Container -->
    <div id="map" style="top: 60px;"></div>

    <!-- Floating Sidebar -->
    <div class="sidebar" style="top: 80px;">
        <div class="header">
            <div class="brand">
                <i class="ri-fire-fill"></i>
                <h1>FireNexus</h1>
            </div>
            <div class="subtitle">Global Real-Time Wildfire Intelligence</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card full">
                <div class="stat-label">Total Active Fires</div>
                <div class="stat-value" id="totalFires">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Severe</div>
                <div class="stat-value danger" id="severeFires">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Moderate</div>
                <div class="stat-value warning" id="moderateFires">-</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>SEVERITY FILTER</label>
                <div class="select-wrapper">
                    <select id="severityFilter">
                        <option value="all">Show All Fires</option>
                        <option value="severe">Severe Only (>100MW)</option>
                        <option value="moderate">Moderate Only</option>
                    </select>
                    <i class="ri-arrow-down-s-line"></i>
                </div>
            </div>
            
            <button class="btn btn-primary" onclick="refreshData()">
                <i class="ri-refresh-line"></i>
                Refresh Data
            </button>
        </div>

        <div class="legend">
            <div class="legend-title">Map Legend</div>
            <div class="legend-item">
                <div class="dot severe"></div>
                <span>Severe Fire (High Confidence)</span>
            </div>
            <div class="legend-item">
                <div class="dot moderate"></div>
                <span>Moderate Fire (Nominal)</span>
            </div>
        </div>

        <div class="footer">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>System Online</span>
            </div>
            <div id="lastUpdate">Waiting for update...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Custom JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
